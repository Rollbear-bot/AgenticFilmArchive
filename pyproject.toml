[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-film-archive"
version = "1.0.0"
description = "AI Agent驱动的胶片摄影归档助理"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Rollbear", email = "rollbear@example.com"},
]
keywords = [
    "film-photography",
    "ai-agent",
    "multimodal-rag",
    "vector-database",
    "langchain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LangChain ecosystem
    "langchain~=1.1.0",
    "langchain-core~=1.2.6",
    "langchain-community~=0.4.1",
    "langchain-openai~=1.1.0",
    "langchain-text-splitters~=1.0.0",
    "langchain-chroma~=1.1.0",
    # langgraph-prebuilt 1.0.9+ imports ExecutionInfo/ServerInfo from
    # langgraph.runtime, which don't exist until langgraph>=1.1.5.
    # Pin to 1.0.8 (the last safe release) to remain compatible with
    # langchain~=1.1.0's langgraph<1.1.0 constraint.
    "langgraph-prebuilt<1.0.9",

    # Web framework
    "django>=4.2,<6.0",
    "djangorestframework>=3.14.0,<4.0.0",
    "django-cors-headers>=4.0.0,<5.0.0",

    # AI / ML
    "volcengine-python-sdk~=5.0.6",
    "numpy~=2.2.6",
    "scikit-learn~=1.8.0",

    # Image processing
    "pillow~=11.3.0",

    # Utilities
    "python-dotenv~=1.2.1",
    "requests>=2.31.0",

    # Reranker
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/Rollbear-bot/AgenticFilmArchive"
Repository = "https://github.com/Rollbear-bot/AgenticFilmArchive"
Issues = "https://github.com/Rollbear-bot/AgenticFilmArchive/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
# uv specific configurations
python-preference = "only-managed"

[tool.uv.pip]
generate-hashes = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

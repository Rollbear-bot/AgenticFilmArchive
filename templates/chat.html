{% extends "base.html" %}

{% block title %}智能对话 - 胶片摄影归档系统{% endblock %}

{% block content %}
<div class="page chat-page" x-data="chatPage()">
    <div class="page-header">
        <h2>智能对话</h2>
    </div>

    <div class="chat-container">
        <div class="chat-messages" x-ref="messagesContainer">
            <template x-for="(msg, index) in messages" :key="index">
                <div class="message" :class="msg.role">
                    <div class="message-avatar">
                        <span x-text="msg.role === 'user' ? '👤' : '🤖'"></span>
                    </div>
                    <div class="message-content">
                        <div class="message-text" x-html="formatMessage(msg.content)"></div>
                        
                        <!-- 工具调用信息 -->
                        <div class="tool-calls" x-show="msg.tool_calls && msg.tool_calls.length > 0">
                            <template x-for="(tool, tIndex) in msg.tool_calls" :key="'tool-' + index + '-' + tIndex">
                                <div class="tool-call">
                                    <span class="tool-icon">🔧</span>
                                    <span class="tool-name" x-text="tool.tool"></span>
                                    <span class="tool-detail" x-show="tool.query">查询: "<span x-text="tool.query"></span>"</span>
                                    <span class="tool-result" x-show="tool.result_count">找到 <span x-text="tool.result_count"></span> 个结果</span>
                                </div>
                            </template>
                        </div>
                        
                        <div class="message-time" x-text="msg.time"></div>
                    </div>
                </div>
            </template>

            <div class="loading-message" x-show="loading">
                <div class="message assistant">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <div class="typing-indicator">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <textarea 
                x-model="inputMessage" 
                @keydown.enter.ctrl="sendMessage()"
                placeholder="输入消息... (Ctrl+Enter 发送)"
                class="chat-input"
                rows="3"
            ></textarea>
            <div class="chat-actions">
                <span class="hint">Ctrl+Enter 发送</span>
                <button class="btn btn-primary" @click="sendMessage()" :disabled="loading || !inputMessage.trim()">
                    发送
                </button>
            </div>
        </div>

        <div class="chat-sidebar">
            <h3>快捷问题</h3>
            <div class="quick-questions">
                <template x-for="(q, index) in quickQuestions" :key="index">
                    <button class="quick-question" @click="askQuickQuestion(q)">
                        <span x-text="q"></span>
                    </button>
                </template>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function chatPage() {
    return {
        messages: [],
        inputMessage: '',
        loading: false,
        quickQuestions: [
            '如何选择胶片？',
            '拍摄夜景的技巧？',
            '什么是胶片颗粒感？',
            '推荐几个胶片型号',
            '如何冲洗胶片？'
        ],

        formatMessage(content) {
            if (!content) return '';
            return content.replace(/\n/g, '<br>');
        },

        async sendMessage() {
            const message = this.inputMessage.trim();
            if (!message || this.loading) return;

            this.messages.push({
                role: 'user',
                content: message,
                time: new Date().toLocaleTimeString()
            });

            this.inputMessage = '';
            this.loading = true;

            this.$nextTick(() => {
                this.$refs.messagesContainer.scrollTop = this.$refs.messagesContainer.scrollHeight;
            });

            try {
                const response = await fetch('/api/v1/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        include_resources: true
                    })
                });

                const data = await response.json();

                this.messages.push({
                    role: 'assistant',
                    content: data.answer || '抱歉，我暂时无法回答您的问题。',
                    time: new Date().toLocaleTimeString(),
                    tool_calls: data.resources_used || []
                });
            } catch (e) {
                this.messages.push({
                    role: 'assistant',
                    content: '抱歉，连接服务器时出现错误，请稍后重试。',
                    time: new Date().toLocaleTimeString(),
                    tool_calls: []
                });
            } finally {
                this.loading = false;
                this.$nextTick(() => {
                    this.$refs.messagesContainer.scrollTop = this.$refs.messagesContainer.scrollHeight;
                });
            }
        },

        askQuickQuestion(question) {
            this.inputMessage = question;
            this.sendMessage();
        },

        init() {
            this.messages.push({
                role: 'assistant',
                content: '您好！我是胶片摄影智能助手。您可以向我咨询关于胶片摄影的任何问题，我会尽力为您解答。',
                time: new Date().toLocaleTimeString()
            });
        }
    };
}
</script>

<style>
.tool-calls {
    margin-top: 8px;
    padding: 8px 12px;
    background: #f8f9fa;
    border-radius: 6px;
    border-left: 3px solid #3498db;
}

.tool-call {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 4px;
}

.tool-call:last-child {
    margin-bottom: 0;
}

.tool-icon {
    font-size: 1rem;
}

.tool-name {
    font-weight: 600;
    color: #3498db;
}

.tool-detail {
    color: #999;
}

.tool-result {
    margin-left: auto;
    color: #27ae60;
    font-weight: 500;
}
</style>
{% endblock %}

{% extends "base.html" %}

{% block title %}资源浏览 - 胶片摄影归档系统{% endblock %}

{% block content %}
<div class="page resources-page" x-data="resourcesPage()">
    <div class="page-header">
        <h2>资源浏览</h2>
        <div class="page-actions">
            <button class="btn btn-primary" @click="loadResources()">刷新</button>
        </div>
    </div>

    <div class="resources-filter">
        <select x-model="filters.fileType" @change="loadResources()">
            <option value="all">全部类型</option>
            <option value="image">仅图片</option>
            <option value="text">仅文档</option>
        </select>
    </div>

    <div class="resources-grid" x-show="resources.length > 0">
        <template x-for="resource in resources" :key="resource.id">
            <div class="resource-card" @click="viewDetail(resource.id)">
                <div class="resource-thumbnail">
                    <template x-if="resource.file_type === 'image'">
                        <div class="thumbnail-image" :style="'background-color: #f0f0f0;'">
                            <span x-text="resource.file_name.substring(0, 20) + '...'"></span>
                        </div>
                    </template>
                    <template x-if="resource.file_type === 'text'">
                        <div class="thumbnail-doc">📄</div>
                    </template>
                </div>
                <div class="resource-info">
                    <h4 x-text="resource.file_name"></h4>
                    <div class="resource-tags" x-show="resource.scene_tags">
                        <span class="tag" x-text="resource.scene_tags || '-'"></span>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <div class="loading" x-show="loading">
        <div class="spinner"></div>
        <span>加载中...</span>
    </div>

    <div class="empty-state" x-show="!loading && resources.length === 0">
        <p>暂无资源，请先同步资源目录</p>
        <a href="/sync/" class="btn btn-primary">去同步</a>
    </div>

    <div class="pagination" x-show="total > pageSize">
        <button class="btn" @click="prevPage()" :disabled="page === 1">上一页</button>
        <span x-text="'第 ' + page + ' 页 / 共 ' + Math.ceil(total / pageSize) + ' 页'"></span>
        <button class="btn" @click="nextPage()" :disabled="page >= Math.ceil(total / pageSize)">下一页</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function resourcesPage() {
    return {
        resources: [],
        loading: false,
        page: 1,
        pageSize: 20,
        total: 0,
        filters: {
            fileType: 'all'
        },
        
        async loadResources() {
            this.loading = true;
            try {
                const params = new URLSearchParams({
                    page: this.page,
                    page_size: this.pageSize
                });
                
                const response = await fetch(`/api/v1/resources/?${params}`);
                const data = await response.json();
                
                if (data.results) {
                    this.resources = data.results;
                    this.total = data.total;
                }
            } catch (e) {
                console.error('加载资源失败:', e);
            } finally {
                this.loading = false;
            }
        },
        
        viewDetail(id) {
            window.location.href = `/resources/${id}/`;
        },
        
        async prevPage() {
            if (this.page > 1) {
                this.page--;
                await this.loadResources();
            }
        },
        
        async nextPage() {
            if (this.page < Math.ceil(this.total / this.pageSize)) {
                this.page++;
                await this.loadResources();
            }
        },
        
        init() {
            this.loadResources();
        }
    };
}
</script>
{% endblock %}

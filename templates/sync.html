{% extends "base.html" %}

{% block title %}资源同步 - 胶片摄影归档系统{% endblock %}

{% block content %}
<div class="page sync-page" x-data="syncPage()">
    <div class="page-header">
        <h2>资源同步</h2>
    </div>

    <div class="sync-info">
        <div class="info-card">
            <h3>资源目录</h3>
            <p x-text="resourceDir"></p>
        </div>
        <div class="info-card">
            <h3>向量数据库</h3>
            <p x-text="vectorDbPath"></p>
        </div>
    </div>

    <div class="sync-actions">
        <button 
            class="btn btn-primary btn-large" 
            @click="startSync()" 
            :disabled="syncing"
        >
            <span x-show="!syncing">开始同步</span>
            <span x-show="syncing">同步中...</span>
        </button>
    </div>

    <div class="sync-progress" x-show="syncing || syncResult">
        <div class="progress-bar" x-show="syncing">
            <div class="progress-fill"></div>
        </div>

        <div class="sync-result" x-show="syncResult">
            <h3>同步结果</h3>
            <div class="result-stats">
                <div class="stat">
                    <span class="stat-value" x-text="syncResult.files_scanned || 0"></span>
                    <span class="stat-label">扫描文件</span>
                </div>
                <div class="stat">
                    <span class="stat-value" x-text="syncResult.files_added || 0"></span>
                    <span class="stat-label">新增资源</span>
                </div>
                <div class="stat">
                    <span class="stat-value" x-text="syncResult.files_failed || 0"></span>
                    <span class="stat-label">失败</span>
                </div>
            </div>
            <p class="result-message" x-text="syncResult.message"></p>
        </div>
    </div>

    <div class="sync-tips">
        <h3>同步说明</h3>
        <ul>
            <li>同步会扫描资源目录下的所有图片和文档</li>
            <li>新添加的文件会自动生成标签并建立向量索引</li>
            <li>已存在的文件会被跳过，不会重复处理</li>
            <li>首次同步可能需要较长时间，请耐心等待</li>
        </ul>
    </div>

    <div class="sync-history" x-show="history.length > 0">
        <h3>同步历史</h3>
        <div class="history-list">
            <template x-for="(item, index) in history" :key="index">
                <div class="history-item">
                    <span class="history-time" x-text="item.time"></span>
                    <span class="history-message" x-text="item.message"></span>
                </div>
            </template>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function syncPage() {
    return {
        resourceDir: '{{ resource_dir }}' || '/path/to/resources',
        vectorDbPath: '{{ vector_db_path }}' || '/path/to/vector_db',
        syncing: false,
        syncResult: null,
        history: [],

        async startSync() {
            this.syncing = true;
            this.syncResult = null;

            try {
                const response = await fetch('/api/v1/resources/sync/', {
                    method: 'POST'
                });

                this.syncResult = await response.json();

                // 添加到历史记录
                this.history.unshift({
                    time: new Date().toLocaleString(),
                    message: this.syncResult.message
                });
            } catch (e) {
                this.syncResult = {
                    files_scanned: 0,
                    files_added: 0,
                    files_failed: 0,
                    message: '同步失败: ' + e.message
                };
            } finally {
                this.syncing = false;
            }
        },

        init() {
            // 加载配置
            fetch('/api/v1/config/')
                .then(res => res.json())
                .then(data => {
                    this.resourceDir = data.resource_dir;
                    this.vectorDbPath = data.vector_db_path;
                })
                .catch(console.error);
        }
    };
}
</script>
{% endblock %}

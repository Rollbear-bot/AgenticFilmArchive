{% extends "base.html" %}

{% block title %}资源详情 - 胶片摄影归档系统{% endblock %}

{% block content %}
<div class="page detail-page" x-data="detailPage()">
    <div class="page-header">
        <button class="btn btn-back" @click="goBack()">← 返回</button>
        <h2>资源详情</h2>
    </div>

    <div class="detail-content" x-show="resource">
        <div class="detail-main">
            <template x-if="resource.file_type === 'image'">
                <div class="image-viewer">
                    <div class="image-container">
                        <img :src="getImageSrc()" alt="" class="detail-image" @load="imageLoaded = true">
                        <div class="image-loading" x-show="!imageLoaded">
                            <div class="spinner"></div>
                            <span>加载图片中...</span>
                        </div>
                    </div>
                </div>
            </template>
            <template x-if="resource.file_type === 'text'">
                <div class="doc-viewer">
                    <div class="doc-content" x-text="resource.content"></div>
                </div>
            </template>
        </div>

        <div class="detail-sidebar">
            <div class="info-card">
                <h3>基本信息</h3>
                <div class="info-row">
                    <label>文件名：</label>
                    <span x-text="resource.file_name || '-'"></span>
                </div>
                <div class="info-row">
                    <label>类型：</label>
                    <span x-text="resource.file_type === 'image' ? '图片' : '文档'"></span>
                </div>
                <div class="info-row" x-show="resource.file_path">
                    <label>路径：</label>
                    <span x-text="resource.file_path" style="word-break: break-all; font-size: 0.85rem;"></span>
                </div>
            </div>

            <div class="info-card" x-show="resource.file_type === 'image'">
                <h3>标签信息</h3>
                <div class="info-row">
                    <label>场景标签：</label>
                    <span x-text="resource.scene_tags || '-'"></span>
                </div>
                <div class="info-row">
                    <label>风格标签：</label>
                    <span x-text="resource.style_tags || '-'"></span>
                </div>
                <div class="info-row">
                    <label>胶片特征：</label>
                    <span x-text="resource.film_tags || '-'"></span>
                </div>
            </div>

            <div class="info-card actions">
                <a :href="'/api/v1/resources/' + resourceId + '/download/'" class="btn btn-primary" download>下载文件</a>
            </div>
        </div>
    </div>

    <div class="loading" x-show="loading">
        <div class="spinner"></div>
        <span>加载中...</span>
    </div>

    <div class="error-state" x-show="error">
        <p x-text="error"></p>
        <button class="btn btn-primary" @click="loadResource()">重试</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function detailPage() {
    return {
        resourceId: {{ resource_id }},
        resource: null,
        loading: true,
        error: null,
        imageLoaded: false,
        
        getImageSrc() {
            // content字段存储的是base64数据URL
            if (this.resource && this.resource.content) {
                // 如果content已经是完整的数据URL，直接返回
                if (this.resource.content.startsWith('data:image/')) {
                    return this.resource.content;
                }
            }
            return '';
        },
        
        async loadResource() {
            this.loading = true;
            this.error = null;
            this.imageLoaded = false;
            
            try {
                const response = await fetch(`/api/v1/resources/${this.resourceId}/`);
                if (!response.ok) {
                    throw new Error('资源不存在');
                }
                this.resource = await response.json();
                
                // 图片预加载
                if (this.resource.file_type === 'image') {
                    this.preloadImage();
                }
            } catch (e) {
                this.error = e.message;
            } finally {
                this.loading = false;
            }
        },
        
        preloadImage() {
            const img = new Image();
            img.onload = () => {
                this.imageLoaded = true;
            };
            img.onerror = () => {
                this.imageLoaded = true; // 即使失败也显示，避免一直 loading
                console.error('图片加载失败');
            };
            img.src = this.getImageSrc();
        },
        
        goBack() {
            window.history.back();
        },
        
        init() {
            this.loadResource();
        }
    };
}
</script>
{% endblock %}

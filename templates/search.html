{% extends "base.html" %}

{% block title %}搜索 - 胶片摄影归档系统{% endblock %}

{% block content %}
<div class="page search-page" x-data="searchPage()">
    <div class="page-header">
        <h2>资源搜索</h2>
    </div>

    <div class="search-form">
        <div class="search-input-group">
            <input 
                type="text" 
                x-model="query" 
                @keyup.enter="search()"
                placeholder="输入关键词或描述来搜索..."
                class="search-input"
            >
            <button class="btn btn-primary" @click="search()" :disabled="loading">
                <span x-show="!loading">搜索</span>
                <span x-show="loading">搜索中...</span>
            </button>
        </div>

        <div class="filter-options">
            <label>类型筛选：</label>
            <select x-model="filters.docType" @change="search()">
                <option value="any">全部</option>
                <option value="image">仅图片</option>
                <option value="text">仅文档</option>
            </select>

            <label>场景标签：</label>
            <input type="text" x-model="filters.sceneTags" placeholder="可选" @change="search()">

            <label>风格标签：</label>
            <input type="text" x-model="filters.styleTags" placeholder="可选" @change="search()">

            <label>胶片特征：</label>
            <input type="text" x-model="filters.filmTags" placeholder="可选" @change="search()">
        </div>
    </div>

    <div class="search-results" x-show="results.length > 0">
        <div class="results-header">
            <span>找到 <strong x-text="count"></strong> 个结果</span>
        </div>

        <div class="results-grid">
            <template x-for="result in results" :key="result.file_path">
                <div class="result-card" @click="viewDetail(result)">
                    <div class="result-thumbnail">
                        <template x-if="result.file_type === 'image'">
                            <div class="thumbnail-image">
                                <img :src="getImagePreview(result.content)" alt="" style="max-width: 100%; max-height: 100%; object-fit: cover;">
                            </div>
                        </template>
                        <template x-if="result.file_type === 'text'">
                            <div class="thumbnail-doc">📄</div>
                        </template>
                    </div>
                    <div class="result-info">
                        <h4 x-text="result.file_name"></h4>
                        <div class="result-score" x-show="result.score">
                            相似度: <span x-text="(result.score * 100).toFixed(1) + '%'"></span>
                        </div>
                        <div class="result-tags" x-show="result.scene_tags">
                            <span class="tag" x-text="result.scene_tags || '-'"></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <div class="loading" x-show="loading">
        <div class="spinner"></div>
        <span>搜索中...</span>
    </div>

    <div class="empty-state" x-show="!loading && searched && results.length === 0">
        <p>未找到相关结果，请尝试其他关键词</p>
    </div>

    <div class="tips" x-show="!searched">
        <h3>搜索技巧</h3>
        <ul>
            <li>使用自然语言描述，如"街拍风格的黑白照片"</li>
            <li>可以指定场景标签进行筛选</li>
            <li>可以指定胶片类型，如" Kodak Portra 400"</li>
        </ul>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function searchPage() {
    return {
        query: '',
        loading: false,
        searched: false,
        results: [],
        count: 0,
        filters: {
            docType: 'any',
            sceneTags: '',
            styleTags: '',
            filmTags: ''
        },

        getImagePreview(content) {
            // content is base64 data URL
            return content || '';
        },

        async search() {
            if (!this.query.trim()) return;
            
            this.loading = true;
            this.searched = true;
            
            try {
                const params = new URLSearchParams({
                    query: this.query,
                    k: 20,
                    doc_type: this.filters.docType
                });
                
                if (this.filters.sceneTags) {
                    params.append('scene_tags', this.filters.sceneTags);
                }
                if (this.filters.styleTags) {
                    params.append('style_tags', this.filters.styleTags);
                }
                if (this.filters.filmTags) {
                    params.append('film_tags', this.filters.filmTags);
                }
                
                const response = await fetch(`/api/v1/resources/search/?${params}`);
                const data = await response.json();
                
                this.results = data.results || [];
                this.count = data.count || 0;
            } catch (e) {
                console.error('搜索失败:', e);
                this.results = [];
            } finally {
                this.loading = false;
            }
        },

        viewDetail(result) {
            // 使用file_path来查找对应的资源ID
            this.findResourceIdByPath(result.file_path).then(id => {
                if (id !== null) {
                    window.location.href = `/resources/${id}/`;
                } else {
                    alert('该资源无法访问');
                }
            });
        },

        async findResourceIdByPath(filePath) {
            // 遍历资源列表找到匹配的文件路径
            try {
                const response = await fetch('/api/v1/resources/');
                const data = await response.json();
                
                if (data.results) {
                    for (const res of data.results) {
                        if (res.file_path === filePath) {
                            return res.id;
                        }
                    }
                }
            } catch (e) {
                console.error('查找资源ID失败:', e);
            }
            return null;
        },

        init() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('q')) {
                this.query = urlParams.get('q');
                this.search();
            }
        }
    };
}
</script>
{% endblock %}
